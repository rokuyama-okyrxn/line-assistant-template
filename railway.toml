# Railway reads this file. NOTE: Railway says this file type (config as code) is being replaced by
# Infrastructure as Code and that existing files work until 2026-12-01 (docs.railway.com/config-as-code/reference,
# read 2026-10-14). Volumes and variables are NOT set here; they are set in Railway's template composer.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
